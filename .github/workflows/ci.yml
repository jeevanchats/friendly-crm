name: Friendly CRM CI Pipeline

on:
  push:
    branches: [main, feature/**, fix/**, ci/**]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Typecheck, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendly_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friendly_crm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo packages
        run: npx turbo run check-types

      - name: Build monorepo packages and apps
        run: npx turbo run build

      - name: Create the database tables
        run: npm run db:migrate

      - name: Run Monorepo API Test Suites
        run: |
          cd apps/api
          npm test -- --ci --maxWorkers=2
        env:
          NODE_ENV: test
          ENABLE_DEV_SMS_GATEWAY: 'true'
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
