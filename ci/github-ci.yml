# ==============================================================================
# FRIENDLY CRM — CONTINUOUS INTEGRATION (CI) PIPELINE SPECIFICATION
# ==============================================================================
# Move or symlink this file to .github/workflows/ci.yml in your repository
# when enabling automated GitHub Actions runners with 'workflow' scope.
# ==============================================================================

name: Friendly CRM CI Pipeline

on:
  push:
    branches: [main, feature/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Typecheck, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo packages
        run: npx turbo run check-types

      - name: Build monorepo packages and apps
        run: npx turbo run build

      - name: Run Monorepo API Test Suites
        run: |
          cd apps/api
          npm test -- --ci --maxWorkers=2
        env:
          NODE_ENV: test
          ENABLE_DEV_SMS_GATEWAY: 'true'
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
